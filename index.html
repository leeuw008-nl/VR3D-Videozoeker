<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR3D Videozoeker</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#153b5c;background:#f5f8fc}header{background:#126ba8;color:white;padding:14px 18px}h1{font-size:1.4rem;margin:0}header small{opacity:.85}form{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:white}input,select,button{font:inherit;padding:10px;border:1px solid #bdd2df;border-radius:7px}input{flex:1;min-width:160px}button{background:#126ba8;color:white;cursor:pointer}button:disabled{opacity:.5}#status{padding:6px 12px;font-size:.85rem;background:white;color:#516b7d}.layout{display:grid;grid-template-columns:330px 1fr;height:calc(100dvh - 155px);min-height:420px}#results{background:white;overflow:auto;padding:12px}.item{display:flex;gap:10px;border-bottom:1px solid #dce7ee;padding:10px 0;cursor:pointer}.item img{width:100px;height:60px;object-fit:cover}.item strong{font-size:.88rem}.item small{display:block;color:#587185}#map{height:100%}.leaflet-popup-content img{width:100%;max-width:230px}@media(max-width:700px){.layout{display:flex;flex-direction:column;height:auto}#map{height:55vh;order:0}#results{order:1;max-height:40vh}}
</style></head><body><header><h1>VR3D Videozoeker</h1><small>3D-video's ontdekken op OpenStreetMap — testversie</small></header><form id="form"><input id="query" aria-label="Zoekterm" value="VR180 3D" placeholder="Zoek video's"><select id="filter" aria-label="Videotype"><option value="all">Alle kandidaten</option><option value="vr180">VR180</option><option value="360">360°</option><option value="sbs">SBS</option></select><button id="submit">Zoeken</button></form><div id="status" role="status">Video's laden…</div><div class="layout"><aside id="results"></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://vr3d-videozoeker-api.tjeerd-jolanda-deleeuw.workers.dev/search';const map=L.map('map').setView([50,8],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);let videos=[];const status=document.querySelector('#status'),results=document.querySelector('#results');function node(tag,text){const e=document.createElement(tag);if(text!=null)e.textContent=text;return e}function show(){markers.clearLayers();results.replaceChildren();let shown=0,bounds=[];const filter=document.querySelector('#filter').value;for(const v of videos){if(!v.location||v.excludedByContentFilter||v.embeddable===false)continue;const kind=v.classification||'';if(filter!=='all'&&!kind.includes(filter))continue;const lat=Number(v.location.latitude),lng=Number(v.location.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)continue;shown++;bounds.push([lat,lng]);const marker=L.marker([lat,lng]).addTo(markers);const popup=node('div');const img=node('img');img.src=v.thumbnail||'';img.alt='Video-miniatuur';popup.append(img,node('h3',v.title),node('p',v.locationDescription||'Locatie volgens YouTube'));const link=node('a','Bekijk video op YouTube');link.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.videoId);link.target='_blank';link.rel='noopener noreferrer';popup.append(link);marker.bindPopup(popup);const item=node('div');item.className='item';const thumb=node('img');thumb.src=v.thumbnail||'';thumb.alt='';const detail=node('div');detail.append(node('strong',v.title),node('small',v.locationDescription||'GPS-locatie'));item.append(thumb,detail);item.onclick=()=>{map.setView([lat,lng],Math.max(10,map.getZoom()));marker.openPopup()};results.append(item)}if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:11});else results.append(node('p','Geen video's met coördinaten voor deze selectie.'));status.textContent=shown+' locaties op de kaart, uit '+videos.length+' gevonden video's. 3D-weergave nog niet onafhankelijk bevestigd.';setTimeout(()=>map.invalidateSize(),50)}async function search(){const q=document.querySelector('#query').value.trim();if(q.length<2){status.textContent='Voer minimaal twee tekens in.';return}const button=document.querySelector('#submit');button.disabled=true;status.textContent='Zoeken op YouTube…';try{const r=await fetch(API+'?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||d.message||'API-fout');videos=Array.isArray(d.videos)?d.videos:[];show()}catch(e){videos=[];markers.clearLayers();results.replaceChildren(node('p','Zoeken mislukt: '+e.message));status.textContent='Controleer de Cloudflare Worker.'}finally{button.disabled=false}}document.querySelector('#form').onsubmit=e=>{e.preventDefault();search()};document.querySelector('#filter').onchange=show;search();
</script></body></html>
