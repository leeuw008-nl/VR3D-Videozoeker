<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR3D Videozoeker</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;color:#153b5c;background:#f5f8fc}header{background:#126ba8;color:white;padding:14px 18px}h1{font-size:1.4rem;margin:0}header small{opacity:.85}form{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:white}input,select,button{font:inherit;padding:10px;border:1px solid #bdd2df;border-radius:7px}input{flex:1;min-width:160px}button{background:#126ba8;color:white;cursor:pointer}button:disabled{opacity:.5}#status{padding:6px 12px;font-size:.85rem;background:white;color:#516b7d}.layout{display:grid;grid-template-columns:330px 1fr;height:calc(100dvh - 155px);min-height:420px}#results{background:white;overflow:auto;padding:12px}.item{display:flex;gap:10px;border-bottom:1px solid #dce7ee;padding:10px 0;cursor:pointer}.item img{width:100px;height:60px;object-fit:cover}.item strong{font-size:.88rem}.item small{display:block;color:#587185}#map{height:100%}.leaflet-popup-content img{width:100%;max-width:230px}@media(max-width:700px){.layout{display:flex;flex-direction:column;height:auto}#map{height:55vh;order:0}#results{order:1;max-height:40vh}}
</style></head><body><header><h1>VR3D Videozoeker</h1><small>3D-video's ontdekken op OpenStreetMap — testversie</small></header><form id="form"><input id="query" aria-label="Zoekterm" value="VR180 3D" placeholder="Zoek video's"><select id="filter" aria-label="Videotype"><option value="all">Alle kandidaten</option><option value="vr180">VR180</option><option value="360">360°</option><option value="sbs">SBS</option></select><button id="submit">Zoeken</button></form><div id="status" role="status">Video's laden…</div><div class="layout"><aside id="results"></aside><div id="map"></div></div><script>
(function(){
'use strict';
const API='https://vr3d-videozoeker-api.tjeerd-jolanda-deleeuw.workers.dev/search';
const status=document.getElementById('status'),results=document.getElementById('results'),map=document.getElementById('map');
const form=document.getElementById('form'),button=document.getElementById('submit'),filter=document.getElementById('filter');
let videos=[];
function element(tag,value){const e=document.createElement(tag);if(value!==undefined)e.textContent=value;return e;}
let places=[],centerLat=50,centerLon=8,zoom=5;
function project(lat,lon,z){const n=256*Math.pow(2,z);const clamped=Math.max(-85.0511,Math.min(85.0511,lat));return {x:(lon+180)/360*n,y:(1-Math.log(Math.tan(clamped*Math.PI/180)+1/Math.cos(clamped*Math.PI/180))/Math.PI)/2*n};}
function renderMap(){map.replaceChildren();map.style.cssText='position:relative;overflow:hidden;background:#dce8ed;min-height:400px';const w=map.clientWidth||700,h=map.clientHeight||500;const center=project(centerLat,centerLon,zoom),scale=Math.pow(2,zoom),maxTile=scale-1;const tileX0=Math.floor((center.x-w/2)/256),tileX1=Math.floor((center.x+w/2)/256),tileY0=Math.floor((center.y-h/2)/256),tileY1=Math.floor((center.y+h/2)/256);
for(let x=tileX0;x<=tileX1;x++)for(let y=tileY0;y<=tileY1;y++){if(y<0||y>maxTile)continue;const tile=element('img');tile.src='https://tile.openstreetmap.org/'+zoom+'/'+((x%scale+scale)%scale)+'/'+y+'.png';tile.alt='';tile.style.cssText='position:absolute;width:256px;height:256px;max-width:none;pointer-events:none;left:'+(x*256-center.x+w/2)+'px;top:'+(y*256-center.y+h/2)+'px';map.append(tile);}
for(const p of places){const xy=project(p.lat,p.lon,zoom),left=xy.x-center.x+w/2,top=xy.y-center.y+h/2;if(left<0||left>w||top<0||top>h)continue;const pin=element('button','●');pin.title=p.video.title;pin.type='button';pin.setAttribute('aria-label','Bekijk '+p.video.title);pin.style.cssText='position:absolute;left:'+(left-12)+'px;top:'+(top-25)+'px;border:2px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:26px;height:26px;background:#d83228;color:white;padding:0;box-shadow:0 2px 6px #3338;z-index:2';pin.addEventListener('click',()=>{const existing=map.querySelector('.pinpopup');if(existing)existing.remove();const popup=element('div');popup.className='pinpopup';popup.style.cssText='position:absolute;z-index:5;left:'+Math.min(w-235,Math.max(4,left+15))+'px;top:'+Math.max(5,top-110)+'px;background:white;padding:9px;border-radius:8px;box-shadow:0 2px 10px #0005;width:225px';popup.append(element('strong',p.video.title),element('br'));const link=element('a','Bekijk op YouTube');link.href='https://www.youtube.com/watch?v='+encodeURIComponent(p.video.videoId);link.target='_blank';link.rel='noopener noreferrer';popup.append(link);map.append(popup)});map.append(pin);}
const controls=element('div');controls.style.cssText='position:absolute;right:12px;top:12px;z-index:4;display:flex;flex-direction:column;gap:4px';for(const [label,diff] of [['+',1],['−',-1]]){const btn=element('button',label);btn.type='button';btn.style.cssText='font-size:22px;padding:2px 12px';btn.onclick=()=>{zoom=Math.min(15,Math.max(2,zoom+diff));renderMap()};controls.append(btn)}map.append(controls);const attribution=element('div');attribution.style.cssText='position:absolute;right:0;bottom:0;background:#fffd;font-size:11px;padding:3px;z-index:3';const credit=element('a','© OpenStreetMap-bijdragers');credit.href='https://www.openstreetmap.org/copyright';credit.target='_blank';attribution.append(credit);map.append(attribution);}
function focusPlace(lat,lon){centerLat=lat;centerLon=lon;zoom=Math.max(10,zoom);renderMap();}
function fitPlaces(){if(!places.length){map.replaceChildren(element('p','Geen locaties gevonden.'));return;}let minLat=90,maxLat=-90,minLon=180,maxLon=-180;for(const p of places){minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLon=Math.min(minLon,p.lon);maxLon=Math.max(maxLon,p.lon);}centerLat=(minLat+maxLat)/2;centerLon=(minLon+maxLon)/2;const w=map.clientWidth||700,h=map.clientHeight||500;for(let z=11;z>=2;z--){const a=project(maxLat,minLon,z),b=project(minLat,maxLon,z);if(b.x-a.x<w-80&&b.y-a.y<h-80){zoom=z;break;}}renderMap();}
const knownPlaces=[
['Machu Picchu',-13.1631,-72.5450],['Cusco',-13.5319,-71.9675],['Lima',-12.0464,-77.0428],['Berlin',52.52,13.405],['London',51.5072,-0.1276],['Paris',48.8566,2.3522],['Amsterdam',52.3676,4.9041],['Rotterdam',51.9244,4.4777],['Utrecht',52.0907,5.1214],['Ommen',52.5191,6.4237],['Tokyo',35.6762,139.6503],['Kyoto',35.0116,135.7681],['Osaka',34.6937,135.5023],['New York',40.7128,-74.006],['Manhattan',40.7831,-73.9712],['Los Angeles',34.0522,-118.2437],['San Francisco',37.7749,-122.4194],['Las Vegas',36.1699,-115.1398],['Rome',41.9028,12.4964],['Venice',45.4408,12.3155],['Florence',43.7696,11.2558],['Barcelona',41.3874,2.1686],['Madrid',40.4168,-3.7038],['Lisbon',38.7223,-9.1393],['Porto',41.1579,-8.6291],['Vienna',48.2082,16.3738],['Prague',50.0755,14.4378],['Budapest',47.4979,19.0402],['Istanbul',41.0082,28.9784],['Dubai',25.2048,55.2708],['Singapore',1.3521,103.8198],['Hong Kong',22.3193,114.1694],['Bangkok',13.7563,100.5018],['Seoul',37.5665,126.978],['Sydney',-33.8688,151.2093],['Melbourne',-37.8136,144.9631],['Auckland',-36.8485,174.7633],['Reykjavik',64.1466,-21.9426],['Oslo',59.9139,10.7522],['Stockholm',59.3293,18.0686],['Copenhagen',55.6761,12.5683],['Helsinki',60.1699,24.9384],['Brussels',50.8503,4.3517],['Antwerp',51.2194,4.4025],['Edinburgh',55.9533,-3.1883],['Dublin',53.3498,-6.2603],['Niagara Falls',43.0962,-79.0377],['Grand Canyon',36.1069,-112.1129],['Yellowstone',44.428,-110.5885],['Yosemite',37.7456,-119.5936],['Mount Everest',27.9881,86.925],['Petra',30.3285,35.4444],['Giza',29.9773,31.1325],['Cairo',30.0444,31.2357],['Cape Town',-33.9249,18.4241],['Rio de Janeiro',-22.9068,-43.1729],['São Paulo',-23.5505,-46.6333],['Buenos Aires',-34.6037,-58.3816],['Vancouver',49.2827,-123.1207],['Toronto',43.6532,-79.3832],['Montreal',45.5017,-73.5673],['Europa-Park',48.266,7.722],['Tripsdrill',49.0349,9.0524],['Efteling',51.6502,5.0498],['Disneyland Paris',48.8674,2.7836],['Disney World',28.3772,-81.5707],['Disneyland',33.8121,-117.919],['Stonehenge',51.1789,-1.8262],['Taj Mahal',27.1751,78.0421],['Angkor Wat',13.4125,103.867],['Great Wall of China',40.4319,116.5704],['Mount Fuji',35.3606,138.7274]];
function inferredLocation(v){if(v.location&&Number.isFinite(Number(v.location.latitude))&&Number.isFinite(Number(v.location.longitude)))return v;const title=String(v.title||'');const desc=String(v.description||'').slice(0,350);for(const [name,latitude,longitude] of knownPlaces){const pattern=new RegExp('(^|[^\\p{L}])'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\function show(){results.replaceChildren();places=[];const selected=filter.value;for(const v of videos){if(!v.location||v.excludedByContentFilter||v.embeddable===false)continue;')+'(?=$|[^\\p{L}])','iu');if(pattern.test(title)||pattern.test(desc)){return {...v,location:{latitude,longitude},locationDescription:name+' (herkend uit tekst)',locationSource:'text_inferred'};}}return v;}
function show(){results.replaceChildren();places=[];const selected=filter.value;for(const v of videos){if(!v.location||v.excludedByContentFilter||v.embeddable===false)continue;const kind=String(v.classification||'').toLowerCase();if(selected!=='all'&&!kind.includes(selected))continue;const lat=Number(v.location.latitude),lon=Number(v.location.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;places.push({lat,lon,video:v});const item=element('div');item.className='item';const img=element('img');img.src=v.thumbnail||'';img.alt='';img.loading='lazy';const details=element('div');details.append(element('strong',v.title),element('small',(v.locationSource==='text_inferred'?'≈ Tekstlocatie: ':'● GPS: ')+(v.locationDescription||'YouTube-locatie')));const link=element('a','Bekijk op YouTube');link.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.videoId);link.target='_blank';link.rel='noopener noreferrer';details.append(link);item.append(img,details);const btn=element('button','Kaart');btn.type='button';btn.style.cssText='padding:5px';btn.onclick=()=>focusPlace(lat,lon);item.append(btn);results.append(item);}if(!places.length)results.append(element('p','Geen video’s met GPS-coördinaten gevonden.'));fitPlaces();status.textContent=places.length+' pinnen ('+places.filter(p=>p.video.locationSource==='text_inferred').length+' uit tekst herkend) uit '+videos.length+' unieke video’s. 3D niet onafhankelijk bevestigd.';}
window.addEventListener('resize',()=>{if(places.length)renderMap()});
async function search(){const q=document.getElementById('query').value.trim();if(q.length<2){status.textContent='Vul minimaal twee tekens in.';return;}button.disabled=true;status.textContent='YouTube doorzoeken (maximaal 3 zoekopdrachten)…';try{const queries=[q,q+' travel',q+' immersive'];const found=new Map();let errors=[];for(const term of queries){try{const response=await fetch(API+'?q='+encodeURIComponent(term)+'&maxResults=10');const json=await response.json();if(!response.ok||json.ok===false)throw Error(json.message||json.error||'API-fout');for(const video of (Array.isArray(json.videos)?json.videos:[])){if(video.videoId&&!found.has(video.videoId))found.set(video.videoId,video);}status.textContent=found.size+' unieke video’s gevonden…';}catch(e){errors.push(e.message);}}if(!found.size&&errors.length)throw Error(errors[0]);videos=[...found.values()].map(inferredLocation);show();if(errors.length)status.textContent+=' ('+errors.length+' zoekopdracht(en) mislukt)';}catch(e){results.replaceChildren(element('p','Zoeken mislukt: '+e.message));status.textContent='Verbinding met Cloudflare Worker mislukt.';}finally{button.disabled=false;}}
form.addEventListener('submit',e=>{e.preventDefault();search()});filter.addEventListener('change',show);
status.textContent='App gestart — YouTube doorzoeken…';search();
})();
</script></body></html>
